apiVersion: v1
kind: Namespace
metadata: {name: common01}
---
apiVersion: v1
kind: Namespace
metadata: {name: authority01}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: pg-init, namespace: common01}
data:
  init.sql: |
    CREATE ROLE authority01_identityprovider LOGIN PASSWORD 'identityprovider';
    CREATE DATABASE authority01_identityprovider OWNER authority01_identityprovider;
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pg-cluster, namespace: common01}
spec:
  selector: {matchLabels: {app: pg-cluster}}
  template:
    metadata: {labels: {app: pg-cluster}}
    spec:
      runtimeClassName: runsc
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env: [{name: POSTGRES_PASSWORD, value: postgres}]
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: init, mountPath: /docker-entrypoint-initdb.d}]
      volumes: [{name: init, configMap: {name: pg-init}}]
---
apiVersion: v1
kind: Service
metadata: {name: pg-cluster, namespace: common01}
spec: {selector: {app: pg-cluster}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis-master, namespace: authority01}
spec:
  selector: {matchLabels: {app: redis-master}}
  template:
    metadata: {labels: {app: redis-master}}
    spec:
      runtimeClassName: runsc
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args: ["--requirepass", "admin"]
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata: {name: redis-master, namespace: authority01}
spec: {selector: {app: redis-master}, ports: [{port: 6379}]}
