# Minimal stand-in for the "common components" the authority-iaa agent needs: the Postgres cluster
# (Zalando operator in the official set-up) and Kafka (Confluent operator, SASL/PLAIN). Only the
# endpoints, databases and users the agent's rendered manifests reference. Passwords come from the
# lab-secrets Secret that deploy.sh generates (the same values post-render.py substitutes for the
# agent's `vault:` references).
apiVersion: v1
kind: Namespace
metadata: {name: common01}
---
apiVersion: v1
kind: Namespace
metadata: {name: authority01}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: pg-init, namespace: common01}
data:
  init.sh: |
    set -e
    for db in authenticationprovider ejbca identityprovider keycloak onboarding securityattributesprovider usersroles; do
      pw=$(cat /lab-secrets/authority01-$db)
      psql -v ON_ERROR_STOP=1 -U postgres -c "CREATE ROLE authority01_$db LOGIN PASSWORD '$pw'" \
        -c "CREATE DATABASE authority01_$db OWNER authority01_$db"
    done
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pg-cluster, namespace: common01}
spec:
  selector: {matchLabels: {app: pg-cluster}}
  template:
    metadata: {labels: {app: pg-cluster}}
    spec:
      runtimeClassName: runsc
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env: [{name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: lab-secrets, key: postgres}}}]
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, postgres]}, periodSeconds: 3}
          volumeMounts:
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
            - {name: secrets, mountPath: /lab-secrets}
      volumes:
        - {name: init, configMap: {name: pg-init}}
        - {name: secrets, secret: {secretName: lab-secrets}}
---
apiVersion: v1
kind: Service
metadata: {name: pg-cluster, namespace: common01}
spec: {selector: {app: pg-cluster}, ports: [{port: 5432}]}
---
# Single-node KRaft broker, SASL_PLAINTEXT/PLAIN like the official listener the services connect to.
apiVersion: apps/v1
kind: Deployment
metadata: {name: kafka, namespace: common01}
spec:
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      runtimeClassName: runsc
      enableServiceLinks: false   # a KAFKA_PORT env from the Service link breaks the image's config
      containers:
        - name: kafka
          image: apache/kafka:3.8.1
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, /lab/start.sh]
          ports: [{containerPort: 9092}]
          readinessProbe: {tcpSocket: {port: 9092}, periodSeconds: 3}
          resources: {limits: {memory: 1Gi}}
          volumeMounts:
            - {name: start, mountPath: /lab}
            - {name: secrets, mountPath: /lab-secrets}
      volumes:
        - {name: start, configMap: {name: kafka-start}}
        - {name: secrets, secret: {secretName: lab-secrets}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: kafka-start, namespace: common01}
data:
  start.sh: |
    set -e
    users=""
    for u in authprovider onboarding tier2gw usersroles; do
      users="$users user_authority01_$u=\"$(cat /lab-secrets/kafka-$u)\""
    done
    cat > /tmp/jaas.conf <<EOF
    KafkaServer { org.apache.kafka.common.security.plain.PlainLoginModule required
      username="admin" password="$(cat /lab-secrets/kafka-admin)" user_admin="$(cat /lab-secrets/kafka-admin)"$users; };
    EOF
    cat > /tmp/server.properties <<EOF
    process.roles=broker,controller
    node.id=1
    controller.quorum.voters=1@localhost:9093
    listeners=SASL_PLAINTEXT://:9092,CONTROLLER://localhost:9093
    advertised.listeners=SASL_PLAINTEXT://kafka.common01.svc.cluster.local:9092
    listener.security.protocol.map=SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
    controller.listener.names=CONTROLLER
    inter.broker.listener.name=SASL_PLAINTEXT
    sasl.enabled.mechanisms=PLAIN
    sasl.mechanism.inter.broker.protocol=PLAIN
    log.dirs=/tmp/kraft-logs
    num.partitions=1
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    auto.create.topics.enable=true
    EOF
    export KAFKA_OPTS="-Djava.security.auth.login.config=/tmp/jaas.conf"
    export KAFKA_HEAP_OPTS="-Xmx512m -Xms256m"
    /opt/kafka/bin/kafka-storage.sh format -t "$(/opt/kafka/bin/kafka-storage.sh random-uuid)" -c /tmp/server.properties
    exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties
---
apiVersion: v1
kind: Service
metadata: {name: kafka, namespace: common01}
spec: {selector: {app: kafka}, ports: [{port: 9092}]}
