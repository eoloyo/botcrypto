name: GrumeLab
options:
  bundleIdPrefix: app.grumelab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GrumeLab:
    type: application
    platform: iOS
    sources:
      - path: GrumeLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.grumelab.GrumeLab
        PRODUCT_NAME: GrumeLab
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Grume Lab"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Le micro écoute le son de la grume quand vous la frappez, pour mesurer sa fréquence de résonance."
        INFOPLIST_KEY_NSCameraUsageDescription: "La caméra et le LiDAR servent à mesurer la longueur et les diamètres de la grume."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "NO"
    scheme: {}
