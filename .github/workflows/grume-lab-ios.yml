name: Grume Lab iOS

# Builds the Grume Lab iPhone app (folder grume-lab/) on a GitHub macOS runner, unsigned.
# The .ipa is published as a pre-release; Sideloadly signs it with the user's Apple ID
# at install time (see grume-lab/README.md).

on:
  push:
    paths:
      - "grume-lab/**"
      - ".github/workflows/grume-lab-ios.yml"
  workflow_dispatch:

permissions:
  contents: write   # to publish the pre-release with the .ipa

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: grume-lab
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        id: build
        run: |
          set -o pipefail
          xcodebuild \
            -project GrumeLab.xcodeproj \
            -scheme GrumeLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      # Turns compiler errors into annotations, readable on the run page and through the API.
      - name: Report compile errors
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E "error:" build.log | sed -E 's#^/Users/runner/work/[^/]+/[^/]+/##' | sort -u > errors.txt || true
          echo "## Erreurs de compilation" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' errors.txt >> "$GITHUB_STEP_SUMMARY"
          head -10 errors.txt | while IFS= read -r line; do
            echo "::error::${line}"
          done
          if [ ! -s errors.txt ]; then tail -40 build.log; fi

      - name: Package IPA
        run: |
          mkdir -p staging/Payload
          cp -R build/Build/Products/Release-iphoneos/GrumeLab.app staging/Payload/
          (cd staging && zip -qry ../GrumeLab.ipa Payload)
          ls -lh GrumeLab.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrumeLab-ipa
          path: grume-lab/GrumeLab.ipa

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="grume-lab-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" GrumeLab.ipa \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Grume Lab, build ${GITHUB_RUN_NUMBER}" \
            --notes "App iPhone Grume Lab. Fichier GrumeLab.ipa à installer avec Sideloadly : voir grume-lab/README.md."

  # Runs the app in the iOS Simulator and publishes screenshots of each screen.
  # The simulator has no LiDAR, camera or real microphone: the Resonance screen is
  # checked with a synthetic knock (launch argument -demoResonance).
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: grume-lab
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen and generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          phones = [x for k, v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          pro = [x for x in phones if "Pro" in x["name"]]
          print((pro or phones)[-1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build for the simulator
        id: simbuild
        run: |
          set -o pipefail
          xcodebuild \
            -project GrumeLab.xcodeproj \
            -scheme GrumeLab \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -quiet \
            build 2>&1 | tee sim-build.log

      - name: Report compile errors
        if: failure() && steps.simbuild.outcome == 'failure'
        run: |
          grep -E "error:" sim-build.log | sed -E 's#^/Users/runner/work/[^/]+/[^/]+/##' | sort -u | head -10 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Run the app and take screenshots
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE=app.grumelab.GrumeLab
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/GrumeLab.app
          xcrun simctl privacy "$UDID" grant microphone "$BUNDLE" || true
          xcrun simctl privacy "$UDID" grant camera "$BUNDLE" || true
          mkdir -p shots
          shot() {
            name="$1"; shift
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE" "$@"
            sleep 10
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          shot 1-grumes -tab 0
          shot 2-fiche -tab 0 -openLog YES
          shot 3-resonance -tab 1
          shot 4-resonance-demo -tab 1 -demoResonance YES
          shot 5-lidar -tab 2
          shot 6-debit-demo -tab 3 -demoCut YES
          shot 7-debit-3d -tab 3 -demoCut YES -demo3D YES
          xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate 'process == "GrumeLab"' > shots/app-log.txt 2>&1 || true
          ls -l shots

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] || exit 0
          TAG="grume-lab-screens-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" shots/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Grume Lab, captures ${GITHUB_RUN_NUMBER}" \
            --notes "Captures d'écran du simulateur iOS (sans LiDAR ni micro réel)."
